plugins { id 'com.android.application' }
android {
    namespace 'io.raph.speakerstudio'
    compileSdk 35
    defaultConfig {
        applicationId 'io.raph.speakerstudio'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'io.raph.speakerstudio.PreviewInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
