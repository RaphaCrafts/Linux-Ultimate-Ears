[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakerstudio"
version = "0.1.18"
description = "A friendly Linux and Windows desktop controller for Ultimate Ears speakers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "PySide6-Essentials==6.8.3",
    "dbus-next==0.2.3; sys_platform == 'linux'",
    "winrt-Windows.Devices.Bluetooth>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Rfcomm>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Networking.Sockets>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Networking>=3.2,<4; sys_platform == 'win32'",
]

[project.scripts]
speaker-studio = "speakerstudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
