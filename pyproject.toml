[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakerstudio"
version = "0.1.15"
description = "A friendly Linux desktop controller for Ultimate Ears speakers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["PySide6-Essentials==6.8.3", "dbus-next==0.2.3"]

[project.scripts]
speaker-studio = "speakerstudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
